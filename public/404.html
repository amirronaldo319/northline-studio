<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Page not found | SitePilot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3C/svg%3E" />
    <style>
      html,body{margin:0;min-height:100%;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
      main{max-width:36rem;margin:0 auto;padding:22vh 1.5rem 3rem;text-align:center}
      p.label{margin:0 0 .75rem;font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;color:#0066cc}
      h1{margin:0;font-size:clamp(2.5rem,8vw,4rem);line-height:1.06;letter-spacing:-.035em;font-weight:600;text-wrap:balance}
      p{font-size:1.1875rem;line-height:1.5;color:#424245;letter-spacing:-.015em;text-wrap:pretty}
      .actions{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:center;align-items:center;margin-top:1.5rem}
      a.btn{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1.35rem;border-radius:999px;background:#0071e3;color:#fff;font-size:1.0625rem;text-decoration:none}
      a.link{display:inline-flex;align-items:center;min-height:2.75rem;color:#0066cc;font-size:1.0625rem;text-decoration:none}
      a.link:hover,a.mail:hover{text-decoration:underline}
      a.link::after{content:"\203A";margin-inline-start:.3em}
      [dir=rtl] a.link::after{content:"\2039"}
      a:focus-visible{outline:3px solid #0071e3;outline-offset:3px;border-radius:999px}
      a.mail{color:#0066cc;text-decoration:none}
      p.mailline{margin-top:2rem;font-size:1.0625rem;color:#6e6e73}
      :lang(fa) h1,:lang(zh-Hans) h1,:lang(zh-Hant) h1{letter-spacing:0;line-height:1.25}
      :lang(fa) p,:lang(zh-Hans) p,:lang(zh-Hant) p{letter-spacing:0}
    </style>
  </head>
  <body>
    <main>
      <p class="label">SitePilot</p>
      <h1 id="title">That page isn’t here.</h1>
      <p id="text">The link may be old or mistyped. The home page and the work are one tap away.</p>
      <div class="actions">
        <a id="home" class="btn" href="/">Home</a>
        <a id="work" class="link" href="/work/">See the work</a>
      </div>
      <p class="mailline"><span id="mail">Or email</span> <a class="mail" dir="ltr" href="mailto:heyamir319@gmail.com">heyamir319@gmail.com</a></p>
    </main>
    <script>
      // The page is one file for every address that does not exist, so it works out two things from the address:
      // where the site's root is (on github.io/<project>/ it is the first path segment; on its own domain it is "/"),
      // and which language the missing page was in (/fr/…, /fa/…, /zh/…, /zh-hant/…), to answer in that language.
      (function () {
        var parts = location.pathname.split('/').filter(Boolean)
        var root = '/'
        if (/\.github\.io$/.test(location.hostname) && parts.length) root = '/' + parts.shift() + '/'
        var words = {
          fr: { lang: 'fr-CA', doc: 'Page introuvable | SitePilot', title: 'Cette page n’existe pas.', text: 'Le lien est peut-être ancien ou mal saisi. L’accueil et les réalisations sont à un clic.', home: 'Accueil', work: 'Voir les réalisations', mail: 'Ou écrivez à' },
          fa: { lang: 'fa', dir: 'rtl', doc: 'صفحه پیدا نشد | SitePilot', title: 'این صفحه اینجا نیست.', text: 'شاید نشانی قدیمی باشد یا اشتباه تایپ شده باشد. صفحه‌ی خانه و نمونه‌کارها همین‌جاست.', home: 'خانه', work: 'دیدن نمونه‌کارها', mail: 'یا ایمیل بزنید:' },
          zh: { lang: 'zh-Hans', doc: '找不到页面 | SitePilot', title: '找不到这个页面。', text: '链接可能已失效或输入有误。首页和作品就在下面。', home: '首页', work: '查看作品', mail: '或发邮件至' },
          'zh-hant': { lang: 'zh-Hant', doc: '找不到頁面 | SitePilot', title: '找不到這個頁面。', text: '連結可能已失效或輸入有誤。首頁和作品就在下面。', home: '首頁', work: '查看作品', mail: '或寄電郵至' }
        }
        var folder = words[parts[0]] ? parts[0] : ''
        var home = root + (folder ? folder + '/' : '')
        document.getElementById('home').setAttribute('href', home)
        document.getElementById('work').setAttribute('href', home + 'work/')
        var t = words[folder]
        if (!t) return
        document.documentElement.lang = t.lang
        if (t.dir) document.documentElement.dir = t.dir
        document.title = t.doc
        ;['title', 'text', 'home', 'work', 'mail'].forEach(function (id) {
          document.getElementById(id).textContent = t[id]
        })
      })()
    </script>
  </body>
</html>
