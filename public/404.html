<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Page not found | Northline Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3C/svg%3E" />
    <style>
      html,body{margin:0;min-height:100%;background:#f7f4ee;color:#131a2b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      main{max-width:34rem;margin:0 auto;padding:18vh 1.5rem 3rem}
      p.label{margin:0 0 .75rem;font-size:.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#173fd0}
      h1{margin:0;font-size:clamp(2rem,6vw,2.75rem);line-height:1.1;letter-spacing:-.02em}
      p{line-height:1.6;color:#3f4658}
      a.btn{display:inline-block;margin-top:1rem;padding:.8rem 1.4rem;border-radius:999px;background:#173fd0;color:#fff;font-weight:600;text-decoration:none}
      a.btn:focus-visible{outline:3px solid #131a2b;outline-offset:3px}
      a.mail{color:#173fd0}
    </style>
  </head>
  <body>
    <main>
      <p class="label">Northline Studio</p>
      <h1>That page isn’t here.</h1>
      <p>The link may be old or mistyped. The whole site is one page, so everything you’re looking for is on the home page.</p>
      <a id="home" class="btn" href="/">Back to the home page</a>
      <p>Or email <a class="mail" href="mailto:heyamir319@gmail.com">heyamir319@gmail.com</a>.</p>
    </main>
    <script>
      // On a project page (github.io/<project>/) the home page is the first path segment; on a custom domain it is "/".
      (function () {
        var segment = location.pathname.split('/')[1]
        if (/\.github\.io$/.test(location.hostname) && segment) {
          document.getElementById('home').setAttribute('href', '/' + segment + '/')
        }
      })()
    </script>
  </body>
</html>
