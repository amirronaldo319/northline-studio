<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Page not found | SitePilot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3C/svg%3E" />
    <style>
      html,body{margin:0;min-height:100%;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
      main{max-width:36rem;margin:0 auto;padding:22vh 1.5rem 3rem;text-align:center}
      p.label{margin:0 0 .75rem;font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;color:#173fd0}
      h1{margin:0;font-size:clamp(2.5rem,8vw,4rem);line-height:1.04;letter-spacing:-.04em;font-weight:700}
      p{font-size:1.1875rem;line-height:1.5;color:#424245;letter-spacing:-.015em}
      a.btn{display:inline-block;margin-top:1.25rem;padding:.85rem 1.6rem;border-radius:999px;background:#173fd0;color:#fff;font-weight:500;font-size:1.0625rem;text-decoration:none}
      a.btn:focus-visible{outline:3px solid #1d1d1f;outline-offset:3px}
      a.mail{color:#173fd0}
    </style>
  </head>
  <body>
    <main>
      <p class="label">SitePilot</p>
      <h1>That page isn’t here.</h1>
      <p>The link may be old or mistyped. The whole site is one page, so everything you’re looking for is on the home page.</p>
      <a id="home" class="btn" href="/">Back to the home page</a>
      <p>Or email <a class="mail" href="mailto:heyamir319@gmail.com">heyamir319@gmail.com</a>.</p>
    </main>
    <script>
      // On a project page (github.io/<project>/) the home page is the first path segment; on a custom domain it is "/".
      (function () {
        var segment = location.pathname.split('/')[1]
        if (/\.github\.io$/.test(location.hostname) && segment) {
          document.getElementById('home').setAttribute('href', '/' + segment + '/')
        }
      })()
    </script>
  </body>
</html>
