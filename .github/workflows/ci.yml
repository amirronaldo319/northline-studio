name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Browser tests run on the built site. The form endpoint is a dummy, and every test mocks the form service, so nothing is ever sent.
      - name: Browser tests
        run: |
          VITE_FORM_ENDPOINT=https://formspree.io/f/e2e-test npm run build
          npx playwright test
      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
