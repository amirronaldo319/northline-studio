<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px}
  body{background:#f7f4ee;font-family:"Helvetica Neue",Arial,sans-serif;color:#131a2b;position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(#e3dccf 1px,transparent 1px),linear-gradient(90deg,#e3dccf 1px,transparent 1px);background-size:56px 56px;opacity:.55;-webkit-mask-image:radial-gradient(ellipse at 80% 40%,#000 10%,transparent 70%)}
  .wrap{position:absolute;left:80px;top:72px;right:80px;bottom:72px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:18px}
  .tile{width:64px;height:64px;border-radius:20px;background:#2347d6;color:#fff;font-weight:800;font-size:40px;display:grid;place-items:center}
  .name{font-size:36px;font-weight:800;letter-spacing:-.5px}.name span{font-weight:500;color:#5f6576;margin-left:8px}
  h1{font-size:76px;line-height:1.04;letter-spacing:-2.5px;margin:0;max-width:900px}
  .foot{font-size:28px;color:#3f4658;display:flex;gap:28px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#2347d6}
</style></head><body><div class="grid"></div>
<div class="wrap">
  <div class="logo"><div class="tile">N</div><div class="name">Northline<span>Studio</span></div></div>
  <h1>Make your business look as good online as it does in person.</h1>
  <div class="foot">Websites for local businesses<i class="dot"></i>Vancouver and North Vancouver</div>
</div></body></html>
